name = "weather-dashboard-ai"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 天气和 AI 都走这个自定义域名，避免 workers.dev 在中国大陆不稳定。
routes = [
  { pattern = "api.wethdbd.top", custom_domain = true }
]

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://cochyu.github.io,https://www.wethdbd.top,https://wethdbd.top,http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500"
DEEPSEEK_MODEL = "deepseek-chat"

# 不要在这里写任何 Key。
# 使用：
# npx wrangler secret put DEEPSEEK_API_KEY -c worker/wrangler.toml
# npx wrangler secret put OPENWEATHER_API_KEY -c worker/wrangler.toml
